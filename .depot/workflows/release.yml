# Depot CI builds smoke artifacts. It does not publish or release them.

name: Release artifact smoke

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version used for the smoke artifacts
        required: true
        default: 0.0.0-smoke.0
        type: string

permissions:
  contents: read

concurrency:
  group: release-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release_smoke:
    name: Release configuration
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Check public dependencies
        run: vp run check:public-dependencies

      - name: Run release smoke
        run: vp run release:smoke

  desktop:
    name: ${{ matrix.label }}
    needs: release_smoke
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64 DMG
            runner: depot-macos-15
            platform: mac
            target: dmg
            arch: arm64
            extension: dmg
            rust_target: aarch64-apple-darwin
          - label: Windows x64 NSIS
            runner: depot-windows-2025-8
            platform: win
            target: nsis
            arch: x64
            extension: exe
            rust_target: x86_64-pc-windows-msvc
          - label: Linux x64 AppImage
            runner: depot-ubuntu-24.04-8
            platform: linux
            target: AppImage
            arch: x64
            extension: AppImage
            rust_target: x86_64-unknown-linux-gnu
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: ${{ matrix.platform != 'win' }}
          run-install: false

      - name: Install desktop dependencies
        run: vp install --frozen-lockfile --filter=@t3tools/desktop... --filter=akeru-bot... --filter=@t3tools/scripts...

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install ImageMagick
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Import macOS signing certificate
        if: matrix.platform == 'mac'
        uses: apple-actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7.0.0
        with:
          p12-file-base64: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          p12-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}

      - name: Configure App Store Connect API key
        if: matrix.platform == 'mac'
        shell: bash
        env:
          APPSTORE_API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          for variable in \
            APPSTORE_API_KEY_P8 \
            APPSTORE_API_KEY_ID \
            APPSTORE_ISSUER_ID \
            MACOS_SIGNING_IDENTITY; do
            if test -z "${!variable}"; then
              printf 'Required GitHub secret is empty: %s\n' "$variable" >&2
              exit 1
            fi
          done
          case "$MACOS_SIGNING_IDENTITY" in
            "Developer ID Application:"*) ;;
            *)
              printf 'MACOS_SIGNING_IDENTITY must name a Developer ID Application certificate.\n' >&2
              exit 1
              ;;
          esac
          printf '%s' "$APPSTORE_API_KEY_P8" > "$RUNNER_TEMP/notarytool-api-key.p8"
          chmod 600 "$RUNNER_TEMP/notarytool-api-key.p8"

      - name: Build signed macOS artifact
        if: matrix.platform == 'mac'
        shell: bash
        env:
          APPLE_API_KEY: ${{ runner.temp }}/notarytool-api-key.p8
          APPLE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
          CSC_NAME: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          node scripts/update-release-package-versions.ts "$RELEASE_VERSION"
          vp run dist:desktop:artifact \
            --platform mac \
            --target dmg \
            --arch arm64 \
            --build-version "$RELEASE_VERSION" \
            --signed \
            --verbose

      - name: Build unsigned desktop artifact
        if: matrix.platform != 'mac'
        shell: bash
        run: |
          node scripts/update-release-package-versions.ts "$RELEASE_VERSION"
          vp run dist:desktop:artifact \
            --platform "${{ matrix.platform }}" \
            --target "${{ matrix.target }}" \
            --arch "${{ matrix.arch }}" \
            --build-version "$RELEASE_VERSION" \
            --verbose

      - name: Verify artifact
        shell: bash
        run: |
          shopt -s nullglob
          artifacts=(release/*.${{ matrix.extension }})
          if (( ${#artifacts[@]} != 1 )); then
            printf 'Expected one .${{ matrix.extension }} artifact, found %s.\n' "${#artifacts[@]}" >&2
            exit 1
          fi

      - name: Notarize, staple, and verify macOS DMG
        if: matrix.platform == 'mac'
        shell: bash
        env:
          APPLE_API_KEY: ${{ runner.temp }}/notarytool-api-key.p8
          APPLE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          shopt -s nullglob
          artifacts=(release/*.dmg)
          if (( ${#artifacts[@]} != 1 )); then
            printf 'Expected one DMG artifact, found %s.\n' "${#artifacts[@]}" >&2
            exit 1
          fi
          dmg="${artifacts[0]}"

          # electron-builder already submitted and stapled the signed app.
          # This submission owns the DMG that contains that app.
          xcrun notarytool submit "$dmg" \
            --key "$APPLE_API_KEY" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"

          mount_point="$RUNNER_TEMP/akeru-dmg"
          mkdir -p "$mount_point"
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount_point"
          cleanup() {
            hdiutil detach "$mount_point" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          apps=("$mount_point"/*.app)
          if (( ${#apps[@]} != 1 )); then
            printf 'Expected one app in the DMG, found %s.\n' "${#apps[@]}" >&2
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "${apps[0]}"
          xcrun stapler validate "${apps[0]}"
          spctl --assess --type execute --verbose=2 "${apps[0]}"

      - name: Upload smoke artifact
        uses: actions/upload-artifact@v7
        with:
          name: akeru-bot-${{ matrix.platform }}-${{ matrix.arch }}
          path: release/*.${{ matrix.extension }}
          if-no-files-found: error
          retention-days: 7

  cli:
    name: CLI package
    needs: release_smoke
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 20
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=akeru-bot...
              - --filter=@t3tools/web...
              - --filter=@t3tools/scripts...

      - name: Build CLI package
        run: |
          node scripts/update-release-package-versions.ts "$RELEASE_VERSION"
          vp run --filter akeru-bot build

      - name: Dry-run CLI package
        run: node apps/server/scripts/cli.ts publish --dry-run --app-version "$RELEASE_VERSION" --verbose

  marketing:
    name: Marketing site
    needs: release_smoke
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/marketing...

      - name: Typecheck marketing site
        run: vp run --filter @t3tools/marketing typecheck

      - name: Build marketing site
        run: vp run --filter @t3tools/marketing build
