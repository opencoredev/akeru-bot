services:
  tailscale:
    image: tailscale/tailscale:v1.88.4
    hostname: ${AKERU_HOSTNAME:-akeru}
    environment:
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_USERSPACE: "false"
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./serve.json:/config/serve.json:ro
    cap_add: [NET_ADMIN, NET_RAW]
    devices: [/dev/net/tun:/dev/net/tun]
    restart: unless-stopped

  akeru:
    image: ${AKERU_IMAGE:-akeru-remote:local}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    network_mode: service:tailscale
    environment:
      T3CODE_MODE: web
      T3CODE_HOST: 0.0.0.0
      T3CODE_PORT: 3773
      T3CODE_NO_BROWSER: "true"
      AKERU_HOME: /data
    volumes:
      - akeru-data:/data
      - ${AKERU_WORKSPACE:-$HOME}:/workspace
    restart: unless-stopped
    depends_on: [tailscale]

volumes:
  akeru-data:
    name: ${AKERU_DATA_VOLUME:-akeru-data}
  tailscale-state:
    name: ${AKERU_TAILSCALE_VOLUME:-akeru-tailscale-state}
