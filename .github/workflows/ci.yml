# Tenki CI validates pull requests before they reach main.

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact version-branch revision to validate
        required: true
        type: string
      expected_pr_number:
        description: Repository-owned Changesets pull request to validate
        required: true
        type: string

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Repository checks
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false }}
    runs-on: tenki-standard-medium-4c-8g
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.expected_sha || github.sha }}

      - name: Authorize version-branch dispatch
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.expected_pr_number }}
        run: |
          test -n "$EXPECTED_SHA"
          test -n "$PR_NUMBER"
          head_ref="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.ref')"
          head_sha="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')"
          head_repo="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.repo.full_name')"
          author="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.user.login')"
          test "$head_ref" = changeset-release/main
          test "$head_sha" = "$EXPECTED_SHA"
          test "$head_repo" = "$GITHUB_REPOSITORY"
          test "$author" = 'github-actions[bot]'
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Reject repository-owned PR assets
        run: |
          files="$(git ls-files .github/pr-assets)"
          if test -n "$files"; then
            printf 'PR evidence must be uploaded to GitHub, not committed:\n%s\n' "$files" >&2
            exit 1
          fi

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Reject dependencies outside the repository
        run: node scripts/check-public-dependencies.ts

      - name: Install from the committed lockfile
        run: vp install --frozen-lockfile

      - name: Protect stable release versions
        if: >-
          ${{ github.event_name == 'pull_request' &&
              !(github.head_ref == 'changeset-release/main' &&
                github.event.pull_request.head.repo.full_name == github.repository &&
                github.event.pull_request.user.login == 'github-actions[bot]') }}
        run: |
          changed=false
          for manifest in apps/server/package.json apps/desktop/package.json apps/web/package.json packages/contracts/package.json; do
            base_version="$(git show "origin/main:$manifest" | node -e "let data=''; process.stdin.on('data', chunk => data += chunk).on('end', () => console.log(JSON.parse(data).version))")"
            head_version="$(node -p "require('./$manifest').version")"
            if test "$base_version" != "$head_version"; then
              printf '%s changes the stable version from %s to %s. Only the repository-owned Changesets version PR may change release versions.\n' "$manifest" "$base_version" "$head_version" >&2
              changed=true
            fi
          done
          test "$changed" = false

      - name: Require a changeset decision
        if: >-
          ${{ github.event_name == 'pull_request' &&
              !(github.head_ref == 'changeset-release/main' &&
                github.event.pull_request.head.repo.full_name == github.repository &&
                github.event.pull_request.user.login == 'github-actions[bot]') }}
        run: |
          changeset_files="$(git diff --name-only --diff-filter=A origin/main...HEAD -- '.changeset/*.md' ':!.changeset/README.md')"
          if test -z "$changeset_files"; then
            printf 'Add a release changeset with `pnpm changeset` or an explicit empty marker with `pnpm changeset --empty`.\n' >&2
            exit 1
          fi
          vp exec changeset status --since=origin/main

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Validate plugin catalog
        run: node scripts/validate-plugin-catalog.ts

      - name: Test plugin catalog and contribution policy
        run: >-
          vp test run
          scripts/validate-plugin-catalog.test.ts
          scripts/plugin-contribution-policy.test.ts
          plugins/catalog.test.ts
          plugins/schema.test.ts
          plugins/lifecycle-matrix.test.ts

      - name: Lint
        run: vp run lint

      - name: Check formatting
        run: vp run fmt:check

      - name: Typecheck
        run: vp run typecheck

      - name: Build desktop pipeline
        run: vp run build:desktop

      - name: Verify preload bundle output
        run: |
          test -f apps/desktop/dist-electron/preload.cjs
          grep -nE "desktopBridge|getLocalEnvironmentBootstrap|PICK_FOLDER_CHANNEL|wsUrl" apps/desktop/dist-electron/preload.cjs

      - name: Build marketing site
        run: vp run build:marketing

      - name: Test shipped desktop and shared packages
        run: vp run --parallel --concurrency-limit 4 --filter '!akeru-bot' --filter '!t3code-relay' --filter '!@t3tools/monorepo' --filter '!@t3tools/mobile' test

      - name: Test isolated server suite
        run: >-
          vp run --filter akeru-bot test
          --exclude integration/orchestrationEngine.integration.test.ts

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check resource monitor formatting
        run: cargo fmt --manifest-path native/resource-monitor/Cargo.toml -- --check

      - name: Test resource monitor
        run: cargo test --locked --manifest-path native/resource-monitor/Cargo.toml

      - name: Exercise release-only configuration
        run: vp run release:smoke
