name: Installer tests

on:
  pull_request:
    paths:
      - "scripts/install-windows*"
      - ".github/workflows/installer-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installer-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows installer behavior
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Verify installer and Restricted-policy bootstrap
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/install-windows.behavior.test.ps1
