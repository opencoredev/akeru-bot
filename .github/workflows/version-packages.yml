# This workflow keeps one reviewable Changesets version PR. Publishing starts only after that PR merges.

name: Version packages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: version-packages
  cancel-in-progress: true

jobs:
  version:
    name: Update version PR
    runs-on: tenki-standard-medium-4c-8g
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@8a7496fd44e8a1b0a88a7459e36213b2fefc1d15 # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Enable pnpm for Changesets
        run: corepack enable

      # changesets/action finds its PR through the pulls `head` filter, which
      # returns nothing for this fork, so it tried to open a duplicate PR on
      # every push and never refreshed the existing one. Match on head.ref instead.
      - name: Version packages
        id: version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm release:version
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update Version Packages PR
        id: changesets
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BRANCH: changeset-release/main
          TITLE: "chore(release): version packages"
        run: |
          version="$(jq -r .version apps/server/package.json)"
          {
            echo "This PR was opened by the Version packages workflow. Merging it releases akeru-bot $version. Every push to main with new changesets updates it."
            # Every package whose changelog gained a release section, so web-only or desktop-only notes show too.
            git diff --name-only -- '*CHANGELOG.md' | while read -r changelog; do
              dir="$(dirname "$changelog")"
              echo
              echo "# $(jq -r .name "$dir/package.json")@$(jq -r .version "$dir/package.json")"
              awk '/^## /{n++; next} n==1' "$changelog"
            done
          } > "$RUNNER_TEMP/version-pr-body.md"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$RELEASE_BRANCH"
          git add -A
          git commit -m "$TITLE"
          git push --force origin "HEAD:$RELEASE_BRANCH"

          pr="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=open&base=main&per_page=100" \
            --jq ".[] | select(.head.ref == \"$RELEASE_BRANCH\" and .head.repo.full_name == \"$GITHUB_REPOSITORY\") | .number" | head -n 1)"
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --title "$TITLE" --body-file "$RUNNER_TEMP/version-pr-body.md"
          else
            url="$(gh pr create --base main --head "$RELEASE_BRANCH" --title "$TITLE" --body-file "$RUNNER_TEMP/version-pr-body.md")"
            pr="${url##*/}"
          fi
          echo "pullRequestNumber=$pr" >> "$GITHUB_OUTPUT"

      - name: Run checks for the updated version branch
        if: steps.changesets.outputs.pullRequestNumber != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.changesets.outputs.pullRequestNumber }}
        run: |
          head_ref="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.ref')"
          head_sha="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')"
          head_repo="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.repo.full_name')"
          test "$head_ref" = changeset-release/main
          test "$head_repo" = "$GITHUB_REPOSITORY"
          gh workflow run ci.yml --ref "$head_ref" -f expected_sha="$head_sha" -f expected_pr_number="$PR_NUMBER"
