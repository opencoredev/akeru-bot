name: Issue Labels

on:
  push:
    branches:
      - main
    paths:
      - .github/ISSUE_TEMPLATE/**
      - .github/workflows/issue-labels.yml
  pull_request_target:
    types: [opened, reopened, synchronize]
  workflow_dispatch:
permissions:
  issues: write

jobs:
  sync:
    if: github.event_name != 'pull_request_target'
    name: Sync issue labels
    runs-on: tenki-standard-small-2c-4g
    steps:
      - name: Ensure managed issue labels exist
        uses: actions/github-script@v7
        with:
          script: |
            const managedLabels = [
              {
                name: "bug",
                color: "d73a4a",
                description: "Something is broken or behaving incorrectly.",
              },
              {
                name: "enhancement",
                color: "a2eeef",
                description: "Requested improvement or new capability.",
              },
              {
                name: "needs-triage",
                color: "fbca04",
                description: "Issue needs maintainer review and initial categorization.",
              },
              {
                name: "via-triage",
                color: "5319E7",
                description: "Prepared through Akeru agent triage and approved by the user",
              },
              {
                name: "type:plugin",
                color: "5319e7",
                description: "Plugin catalog contribution.",
              },
              {
                name: "type:provider",
                color: "0969da",
                description: "Agent provider contribution.",
              },
              {
                name: "status:needs-triage",
                color: "fbca04",
                description: "Proposal needs maintainer review.",
              },
              {
                name: "area:directory",
                color: "bfdadc",
                description: "Plugin directory and its user interface.",
              },
              {
                name: "area:connectors",
                color: "c5def5",
                description: "Plugin and MCP connector runtime.",
              },
            ];

            for (const label of managedLabels) {
              try {
                const { data: existing } = await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                });

                if (
                  existing.color !== label.color ||
                  (existing.description ?? "") !== label.description
                ) {
                  await github.rest.issues.updateLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name: label.name,
                    color: label.color,
                    description: label.description,
                  });
                }
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }

                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                  color: label.color,
                  description: label.description,
                });
              }
            }

  label-paths:
    if: github.event_name == 'pull_request_target'
    name: Label changed paths
    runs-on: tenki-standard-small-2c-4g
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@v6
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/path-labels.yml
          sync-labels: true